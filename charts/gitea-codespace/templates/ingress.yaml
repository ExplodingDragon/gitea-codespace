{{- if .Values.admin.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gitea-codespace.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitea-codespace.labels" . | nindent 4 }}
  {{- with .Values.admin.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.admin.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.admin.ingress.tlsSecret }}
  tls:
    - secretName: {{ . }}
      {{- with $.Values.admin.ingress.host }}
      hosts: [{{ . | quote }}]
      {{- end }}
  {{- end }}
  rules:
    {{- if .Values.admin.ingress.host }}
    - host: {{ .Values.admin.ingress.host | quote }}
    {{- else }}
    -
    {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gitea-codespace.fullname" . }}-admin
                port:
                  name: http
{{- end }}
