{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gitea-codespace.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitea-codespace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gitea-codespace.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: ["gateway", "cache"]}
      ports:
        - {protocol: TCP, port: 8445}
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: codespace.gitea.dev/site-uid, operator: Exists}
      ports:
        - {protocol: TCP, port: 8443}
    {{- with .Values.networkPolicy.adminIngressCIDRs }}
    - from:
        {{- range . }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 18080}
    {{- end }}
{{- end }}
