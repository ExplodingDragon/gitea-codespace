replicaCount: 2

image:
  repository: ghcr.io/go-gitea/codespace
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

identity:
  clusterIssuer: codespace-identity

admin:
  publicURL: http://127.0.0.1:18080
  tokenSecret:
    name: ""
    key: token
  service:
    type: ClusterIP
    port: 18080
    annotations: {}
  ingress:
    enabled: false
    className: ""
    host: ""
    tlsSecret: ""
    annotations: {}

gatewayAPI:
  parent:
    name: ""
    namespace: ""
    httpListener: ""
    sshListener: ""

serviceAccount:
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

networkPolicy:
  enabled: true
  adminIngressCIDRs: []
