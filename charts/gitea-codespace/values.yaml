replicaCount: 2

image:
  repository: ghcr.io/explodingdragon/gitea-codespace
  tag: main
  digest: ""
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

admin:
  tokenSecret:
    name: ""
    key: token
  service:
    type: ClusterIP
    port: 18080
    annotations: {}
  ingress:
    enabled: false
    className: ""
    host: ""
    tlsSecret: ""
    annotations: {}

serviceAccount:
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

networkPolicy:
  enabled: true
  adminIngressCIDRs: []
