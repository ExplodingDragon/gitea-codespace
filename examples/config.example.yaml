node:
  # A stable name shown in Gitea. It should describe this Manager deployment.
  name: "local-incus-manager"
  state_dir: "codespace-state"
  capacity_total: 4

gateway:
  http:
    listen: ":18081"
    # The externally reachable base URL. A reverse proxy may provide TLS.
    public_url: "https://codespace.example.com"
  ssh:
    listen: ":2222"
    # The externally reachable DNS name and port used by SSH clients.
    public_addr: "codespace.example.com:2222"

runtime:
  git:
    ssh_key_type: "ed25519"
  web_ide:
    # New Codespaces use this explicit code-server release. Recreate an environment to upgrade it.
    code_server_version: "4.121.0"
  cache:
    # Optional OCI registry namespace used for BuildKit cache manifests and layers.
    registry: "https://registry.example.com/gitea-codespace-cache"
    # Each key is the original registry host; each value is its pull-through cache base URL.
    mirrors:
      docker.io: "https://docker-cache.example.com"
      ghcr.io: "https://ghcr-cache.example.com"
      mcr.microsoft.com: "https://mcr-cache.example.com"
  incus:
    # Use unix:///absolute/path for local Incus or https://host:port for an already trusted remote Incus server.
    endpoint: "unix:///var/lib/incus/unix.socket"
    project:
      name: "gitea-codespace"
      manage: true
    storage:
      pool: "default"
    network:
      name: "csnet"
      manage: true
  environments:
    - tag: "debian-lxc"
      description: "General-purpose Linux container"
      type: "lxc"
      source:
        image: "images:debian/12"
      resources:
        cpu: 1
        memory: "1GiB"
        root_disk: "10GiB"

    - tag: "debian-vm"
      description: "Isolated Linux virtual machine"
      type: "vm"
      source:
        image: "images:debian/12"
      resources:
        cpu: 2
        memory: "1GiB"
        root_disk: "20GiB"

    # An existing instance on the configured Incus server can be used as a base image.
    - tag: "company-base"
      description: "Company-managed virtual machine base"
      type: "vm"
      source:
        instance:
          project: "base-images"
          name: "dev-vm-base"
      resources:
        cpu: 2
        memory: "1GiB"
        root_disk: "20GiB"
      profiles: ["company-dev-vm"]
