name: Yep Anywhere Web IDE provider

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/provider-build.yml
      - .github/workflows/provider-yepanywhere.yml
      - providers/yepanywhere/**
      - '!providers/yepanywhere/README.md'
  push:
    branches:
      - main
    paths:
      - .github/workflows/provider-build.yml
      - .github/workflows/provider-yepanywhere.yml
      - providers/yepanywhere/**
      - '!providers/yepanywhere/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider:
    uses: ./.github/workflows/provider-build.yml
    with:
      provider: yepanywhere
      image: ghcr.io/explodingdragon/gitea-codespace-web-ide-yepanywhere
      pnpm-version: 10.34.7
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
