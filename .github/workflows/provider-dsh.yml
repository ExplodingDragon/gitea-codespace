name: DeepSeek Harness Web IDE provider

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/provider-build.yml
      - .github/workflows/provider-dsh.yml
      - providers/dsh/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/provider-build.yml
      - .github/workflows/provider-dsh.yml
      - providers/dsh/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider:
    uses: ./.github/workflows/provider-build.yml
    with:
      provider: dsh
      image: ghcr.io/explodingdragon/gitea-codespace-web-ide-dsh
      pnpm-version: 11.28.5
      publish: ${{ github.event_name != 'pull_request' }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
