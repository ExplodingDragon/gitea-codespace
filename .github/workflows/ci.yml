name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      # Provider images are validated and published by their own workflows.
      - .github/workflows/provider-*.yml
      - providers/**
  push:
    branches:
      - main
    paths-ignore:
      # Provider images are validated and published by their own workflows.
      - .github/workflows/provider-*.yml
      - providers/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_CHART_NAME: ghcr.io/explodingdragon/charts/gitea-codespace
  IMAGE_NAME: ghcr.io/explodingdragon/gitea-codespace

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    env:
      CODESPACE_VERSION: sha-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0
      - name: Install build tools
        run: |
          go mod download
          make install-tools
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Run static checks
        run: make lint
      - name: Run backend tests
        run: make test
      - name: Run administration UI tests
        run: make test-frontend
      - name: Build linux/amd64 binary
        run: make build-linux
      - name: Prepare Gitea CLI
        run: make prepare-gitea-cli
      - name: Upload platform assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitea-codespace-linux-amd64
          path: |
            bin/gitea-codespace
            bin/gt
            bin/gitea-cli.env
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  web-ide-e2e-image:
    name: Build fake Web IDE image
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build fake provider OCI layout
        run: make e2e-web-ide-image WEB_IDE_E2E_IMAGE="localhost/gitea-codespace-web-ide-e2e:ci-${GITHUB_SHA}"
      - name: Upload fake provider image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitea-codespace-web-ide-e2e
          path: .tmp/e2e-web-ide
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true

  image:
    name: Build platform image
    needs: validate
    runs-on: ubuntu-24.04
    env:
      TEST_IMAGE: localhost/gitea-codespace:ci-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download platform assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: gitea-codespace-linux-amd64
          path: bin
      - name: Set binary permissions
        run: |
          chmod 0555 bin/gitea-codespace bin/gt
      - name: Read Gitea CLI metadata
        id: cli
        run: |
          . bin/gitea-cli.env
          echo "version=$GITEA_CLI_VERSION" >>"$GITHUB_OUTPUT"
          echo "sha256=$GITEA_CLI_SHA256" >>"$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            GITEA_CLI_VERSION=${{ steps.cli.outputs.version }}
            GITEA_CLI_SHA256=${{ steps.cli.outputs.sha256 }}
          cache-from: type=gha,scope=platform-image
          cache-to: type=gha,mode=max,scope=platform-image,ignore-error=true
      - name: Verify image contents
        env:
          GITEA_CLI_VERSION: ${{ steps.cli.outputs.version }}
        run: |
          docker run --rm "$TEST_IMAGE" --help >/dev/null
          docker run --rm --entrypoint /bin/sh "$TEST_IMAGE" -ec \
            'command -v dockerd; command -v git; command -v ssh; command -v useradd; command -v groupadd'
          docker run --rm --entrypoint /usr/local/libexec/gitea-codespace/gt "$TEST_IMAGE" version | grep -F "$GITEA_CLI_VERSION"
      - name: Export image for E2E
        run: |
          mkdir -p .tmp/platform-image
          docker image save --output .tmp/platform-image/platform-image.tar "$TEST_IMAGE"
          printf '%s\n' "$TEST_IMAGE" >.tmp/platform-image/tag
      - name: Upload platform image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitea-codespace-platform-image
          path: .tmp/platform-image
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true

  e2e:
    name: E2E (${{ matrix.runtime }})
    needs:
      - image
      - web-ide-e2e-image
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: sysbox
            runtime_class: sysbox-runc
            storage_class: local-path
          - runtime: kata
            runtime_class: kata-qemu-runtime-rs
            storage_class: rawfile-localpv
          - runtime: native
            runtime_class: ''
            storage_class: local-path
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      CODESPACE_E2E_HTTP_PROXY: ${{ vars.CODESPACE_E2E_HTTP_PROXY }}
      CODESPACE_E2E_S3MOCK_IMAGE: ${{ vars.CODESPACE_E2E_S3MOCK_IMAGE }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0
      - name: Download platform image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: gitea-codespace-platform-image
          path: .tmp/platform-image
      - name: Download fake Web IDE image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: gitea-codespace-web-ide-e2e
          path: .tmp/e2e-web-ide
      - name: Install k3s runtime
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: tests/e2e/setup-k3s.sh "$RUNTIME"
      - name: Prepare E2E inputs
        env:
          RUNTIME: ${{ matrix.runtime }}
          RUNTIME_CLASS: ${{ matrix.runtime_class }}
          STORAGE_CLASS: ${{ matrix.storage_class }}
        run: |
          test -r "$KUBECONFIG"

          image_tag="$(cat .tmp/platform-image/tag)"
          image_repository="${image_tag%:*}"
          sudo k3s ctr --namespace k8s.io images import .tmp/platform-image/platform-image.tar
          rm -f .tmp/platform-image/platform-image.tar
          image_digest="$(sudo k3s ctr --namespace k8s.io images list | awk -v ref="$image_tag" '$1 == ref {print $3}')"
          case "$image_digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "imported image has no sha256 digest" >&2; exit 1 ;;
          esac
          image_reference="$image_repository@$image_digest"
          sudo k3s ctr --namespace k8s.io images tag --local "$image_tag" "$image_reference"
          sudo k3s ctr --namespace k8s.io images list | \
            awk -v ref="$image_reference" '$1 == ref {found = 1} END {exit !found}'

          node_address="$(kubectl get node -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')"
          test -n "$node_address"

          {
            echo "CODESPACE_IMAGE=$image_reference"
            echo "WEB_IDE_E2E_IMAGE=$(cat .tmp/e2e-web-ide/tag)"
            echo "CODESPACE_E2E_WEB_IDE_LAYOUT=$PWD/.tmp/e2e-web-ide/layout"
            echo "CODESPACE_E2E_GITEA_LISTEN=$node_address:0"
            echo "CODESPACE_E2E_NODE_ADDRESS=$node_address"
            echo "KUBERNETES_RUNTIME_ISOLATION=$RUNTIME"
            echo "KUBERNETES_RUNTIME_CLASS=$RUNTIME_CLASS"
            echo "KUBERNETES_STORAGE_CLASS=$STORAGE_CLASS"
          } >>"$GITHUB_ENV"
      - name: Run complete E2E suite
        run: make test-e2e
      - name: Collect cluster diagnostics
        if: failure()
        run: |
          directory=.tmp/e2e/ci/diagnostics
          mkdir -p "$directory"
          sudo journalctl -u k3s --no-pager 2>&1 | tee "$directory/k3s.log" >/dev/null || true
          sudo journalctl -u sysbox-mgr -u sysbox-fs --no-pager 2>&1 | tee "$directory/sysbox.log" >/dev/null || true
          kubectl get nodes,runtimeclasses,storageclasses,pods -A -o wide >"$directory/cluster.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp >"$directory/events.txt" 2>&1 || true
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.runtime }}-diagnostics
          path: .tmp/e2e/*/diagnostics
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
      - name: Remove image archive and k3s
        if: always()
        run: |
          rm -rf .tmp/platform-image .tmp/e2e-web-ide
          if test -x /usr/local/bin/k3s-uninstall.sh; then
            sudo /usr/local/bin/k3s-uninstall.sh
          fi

  publish:
    name: Publish artifacts
    if: github.event_name == 'push'
    needs:
      - validate
      - image
      - e2e
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download platform assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: gitea-codespace-linux-amd64
          path: bin
      - name: Set binary permissions
        run: |
          chmod 0555 bin/gitea-codespace bin/gt
      - name: Read Gitea CLI metadata
        id: cli
        run: |
          . bin/gitea-cli.env
          echo "version=$GITEA_CLI_VERSION" >>"$GITHUB_OUTPUT"
          echo "sha256=$GITEA_CLI_SHA256" >>"$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log Helm in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:main
          build-args: |
            GITEA_CLI_VERSION=${{ steps.cli.outputs.version }}
            GITEA_CLI_SHA256=${{ steps.cli.outputs.sha256 }}
          labels: |
            org.opencontainers.image.title=Gitea Codespace
            org.opencontainers.image.description=Kubernetes platform image for Gitea Codespace
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: true
          cache-from: type=gha,scope=platform-image
          cache-to: type=gha,mode=max,scope=platform-image,ignore-error=true
      - name: Package and publish Helm chart
        id: chart
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          mkdir -p .tmp/chart-source .tmp/chart
          cp -R charts/gitea-codespace/. .tmp/chart-source/
          sed -i "s|^  digest: \"\"$|  digest: \"$IMAGE_DIGEST\"|" .tmp/chart-source/values.yaml
          grep -Fx "  digest: \"$IMAGE_DIGEST\"" .tmp/chart-source/values.yaml

          source_version="$(awk '$1 == "version:" {print $2; exit}' .tmp/chart-source/Chart.yaml)"
          test "${source_version##*-}" = 'main.0'
          version="${source_version%-main.0}-main.${GITHUB_RUN_NUMBER}"
          helm package .tmp/chart-source \
            --version "$version" \
            --app-version "main-${GITHUB_SHA}" \
            --destination .tmp/chart
          output="$(helm push ".tmp/chart/gitea-codespace-${version}.tgz" oci://ghcr.io/explodingdragon/charts 2>&1)"
          printf '%s\n' "$output"
          digest="$(printf '%s\n' "$output" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' | tail -n 1)"
          test -n "$digest"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest Helm chart provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.HELM_CHART_NAME }}
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - name: Write published digests
        run: |
          {
            echo '## Published artifacts'
            echo
            echo 'Platform image:'
            echo '```text'
            echo '${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}'
            echo '```'
            echo
            echo 'Helm chart:'
            echo '```text'
            echo 'oci://${{ env.HELM_CHART_NAME }} --version ${{ steps.chart.outputs.version }}'
            echo 'oci://${{ env.HELM_CHART_NAME }}@${{ steps.chart.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
