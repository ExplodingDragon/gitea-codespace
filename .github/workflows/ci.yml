name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_CHART_NAME: ghcr.io/explodingdragon/charts/gitea-codespace
  IMAGE_NAME: ghcr.io/explodingdragon/gitea-codespace

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    env:
      CODESPACE_VERSION: sha-${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0
      - name: Install build tools
        run: |
          go mod download
          make install-proto
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Run static checks
        run: make lint
      - name: Run backend tests
        run: make test
      - name: Run administration UI tests
        run: pnpm --dir web test
      - name: Build linux/amd64 binary
        run: make build-linux
      - name: Verify committed frontend assets
        run: git diff --exit-code -- web/dist
      - name: Upload platform binary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gitea-codespace-linux-amd64
          path: bin/gitea-codespace
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image-check:
    name: Verify platform image
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download platform binary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: gitea-codespace-linux-amd64
          path: bin
      - name: Set binary permissions
        run: chmod 0555 bin/gitea-codespace
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: gitea-codespace:ci
          cache-from: type=gha,scope=platform-image
          cache-to: type=gha,mode=max,scope=platform-image,ignore-error=true
      - name: Verify image contents
        run: |
          docker run --rm gitea-codespace:ci --help >/dev/null
          docker run --rm --entrypoint /bin/sh gitea-codespace:ci -ec \
            'command -v dockerd; command -v git; command -v ssh; command -v useradd; command -v groupadd'

  publish:
    name: Publish artifacts
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download platform binary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: gitea-codespace-linux-amd64
          path: bin
      - name: Set binary permissions
        run: chmod 0555 bin/gitea-codespace
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0
      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log ORAS in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.title=Gitea Codespace
            org.opencontainers.image.description=Kubernetes platform image for Gitea Codespace
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: true
          cache-from: type=gha,scope=platform-image
          cache-to: type=gha,mode=max,scope=platform-image,ignore-error=true
      - name: Package and publish Helm chart
        id: chart
        run: |
          mkdir -p .tmp/chart
          helm package charts/gitea-codespace --destination .tmp/chart
          set -- .tmp/chart/gitea-codespace-*.tgz
          test "$#" -eq 1
          digest="$(oras push \
            --image-spec v1.0 \
            --artifact-type application/vnd.cncf.helm.config.v1+json \
            --annotation 'org.opencontainers.image.title=Gitea Codespace Helm chart' \
            --annotation 'org.opencontainers.image.description=Kubernetes deployment chart for Gitea Codespace' \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation 'org.opencontainers.image.version=main' \
            --annotation 'org.opencontainers.image.licenses=MIT' \
            "${HELM_CHART_NAME}:main" \
            "$1":application/vnd.cncf.helm.chart.content.v1.tar+gzip \
            --format 'go-template={{.digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest Helm chart provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.HELM_CHART_NAME }}
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - name: Write published digests
        run: |
          {
            echo '## Published artifacts'
            echo
            echo 'Platform image:'
            echo '```text'
            echo '${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}'
            echo '```'
            echo
            echo 'Helm chart:'
            echo '```text'
            echo 'oci://${{ env.HELM_CHART_NAME }}@${{ steps.chart.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
