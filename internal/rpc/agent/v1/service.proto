syntax = "proto3";

package agent.v1;

import "codespace/v1/types.proto";

option go_package = "gitea.dev/codespace/internal/rpc/agent/v1;agentv1";

// AgentControlService runs on the elected Manager, behind Pod-bound mTLS.
service AgentControlService {
  // PrepareVolume consumes first-format authorization or confirms a checked filesystem.
  rpc PrepareVolume(PrepareVolumeRequest) returns (PrepareVolumeResponse);
  // Control resumes a session by reporting facts before accepting new execution.
  rpc Control(stream ControlRequest) returns (stream ControlResponse);
  // UploadLogs submits diagnostic output to Manager's bounded memory queue.
  rpc UploadLogs(UploadLogsRequest) returns (UploadLogsResponse);
}

message PrepareVolumeRequest {
  uint32 protocol_version = 1;
  // initialized confirms that ext4 was checked and mounted successfully.
  bool initialized = 2;
}

message PrepareVolumeResponse {}

// AgentAccessService runs on the Runtime Pod, reached directly by Gateway.
service AgentAccessService {
  // Access requires an accepted opening frame before transferring user data.
  rpc Access(stream AccessRequest) returns (stream AccessResponse);
}

// RuntimeEndpointService runs on the Runtime Pod's private Unix socket.
service RuntimeEndpointService {
  // List returns the HTTP endpoints currently published by this runtime.
  rpc List(RuntimeEndpointServiceListRequest) returns (RuntimeEndpointServiceListResponse);
  // Set adds or replaces one endpoint and durably publishes the new target.
  rpc Set(RuntimeEndpointServiceSetRequest) returns (RuntimeEndpointServiceSetResponse);
  // Delete removes one endpoint and durably publishes the new target.
  rpc Delete(RuntimeEndpointServiceDeleteRequest) returns (RuntimeEndpointServiceDeleteResponse);
}

// RuntimeUSBIPService runs on the Runtime Pod's private Unix socket.
service RuntimeUSBIPService {
  // Run executes one bounded USB/IP client operation in the Runtime.
  rpc Run(RuntimeUSBIPServiceRunRequest) returns (RuntimeUSBIPServiceRunResponse);
}

enum RuntimeUSBIPOperation {
  RUNTIME_USBIP_OPERATION_UNSPECIFIED = 0;
  RUNTIME_USBIP_OPERATION_LIST = 1;
  RUNTIME_USBIP_OPERATION_ATTACH = 2;
  RUNTIME_USBIP_OPERATION_STATUS = 3;
  RUNTIME_USBIP_OPERATION_DETACH = 4;
  RUNTIME_USBIP_OPERATION_SOURCES = 5;
}

message RuntimeUSBIPServiceRunRequest {
  uint32 protocol_version = 1;
  RuntimeUSBIPOperation operation = 2;
  string argument = 3;
  string source = 4;
}

message RuntimeUSBIPServiceRunResponse {
  string output = 1;
  repeated USBIPSource sources = 2;
}

// Sources are live SSH registrations, not remote service health checks.
message USBIPSource {
  string name = 1;
  uint32 port = 2;
  string output = 3;
  string error = 4;
  string listener_id = 5;
}

message RuntimeEndpointServiceListRequest {
  uint32 protocol_version = 1;
}

message RuntimeEndpointServiceListResponse {
  repeated codespace.v1.RuntimeEndpoint endpoints = 1;
}

message RuntimeEndpointServiceSetRequest {
  uint32 protocol_version = 1;
  codespace.v1.RuntimeEndpoint endpoint = 2;
}

message RuntimeEndpointServiceSetResponse {}

message RuntimeEndpointServiceDeleteRequest {
  uint32 protocol_version = 1;
  string endpoint_id = 2;
}

message RuntimeEndpointServiceDeleteResponse {}

message ControlRequest {
  uint32 protocol_version = 1;
  // Fresh per connection; stale session replies cannot renew execution.
  string session_id = 2;
  // Strictly increasing within this control session.
  uint64 sequence = 3;
  AgentReport report = 4;
  // accepted_operation_rversion is the operation payload retained by this Agent process.
  int64 accepted_operation_rversion = 5;
}

message AgentReport {
  int64 operation_rversion = 1;
  bytes git_ssh_public_key = 2;
  OperationResult result = 3;
  AccessTarget target = 4;
  codespace.v1.RuntimeBoot boot = 5;
  codespace.v1.RuntimeResourceUsage resource_usage = 6;
}

message OperationResult {
  int64 operation_rversion = 1;
  codespace.v1.FinalStatus status = 2;
  string message = 3;
}

message ControlResponse {
  string session_id = 1;
  uint64 sequence = 2;
  // Measured from the caller's request send time, not reply receipt time.
  int64 permit_valid_for_milliseconds = 3;
  codespace.v1.OperationPayload operation = 4;
  codespace.v1.RuntimeAccessBundle access = 5;
  // A durable Manager result permits Agent to retire this pending result.
  int64 acknowledged_result_version = 6;
  bool cancel_execution = 7;
  // Pinned platform options, applied before the Docker daemon starts.
  RuntimeOptions runtime = 8;
  // Ed25519 verification key for Manager-issued, limited access tickets.
  bytes access_verification_key = 9;
  // operation_rversion identifies the operation covered by this execution permit.
  int64 operation_rversion = 10;
}

message RuntimeOptions {
  string git_ssh_key_type = 1;
  // cache contains one Manager-authorized registry endpoint for this runtime.
  RuntimeCache cache = 2;
  string gitea_url = 3;
  string gitea_ca_bundle = 4;
}

message RuntimeCache {
  string build_registry = 1;
  string build_scope = 2;
  map<string, string> mirrors = 3;
  map<string, RegistryCredential> credentials = 4;
}

message RegistryCredential {
  string username = 1;
  string password = 2;
}

message AccessTarget {
  int64 version = 1;
  string primary_container_id = 2;
  repeated EndpointTarget endpoints = 3;
  bool ready = 4;
  // workspace_folder is the resolved project folder inside the primary Dev Container.
  string workspace_folder = 5;
}

message EndpointTarget {
  codespace.v1.RuntimeEndpoint endpoint = 1;
  string container_id = 2;
  uint32 port = 3;
}

message UploadLogsRequest {
  uint32 protocol_version = 1;
  int64 operation_rversion = 2;
  reserved 3;
  repeated codespace.v1.LogLine lines = 4;
}

message UploadLogsResponse {
  reserved 1;
  // A reply acknowledges handling, not durable storage. Closed ends this stream.
  bool closed = 2;
}

message AccessRequest {
  uint32 protocol_version = 1;
  oneof frame {
    OpenAccess open = 2;
    bytes stdin = 3;
    TerminalSize resize = 4;
    int32 signal = 5;
    bool stdin_eof = 6;
    // Stop accepting; existing ordinary TCP channels remain connected.
    bool stop_listening = 7;
  }
}

message OpenAccess {
  // Signed by Manager; binds site, Runtime, Pod, target version and capability.
  string ticket = 1;
  oneof capability {
    Shell shell = 2;
    Command command = 3;
    SFTP sftp = 4;
    Endpoint endpoint = 5;
    LoopbackTCP tcp = 6;
    ReverseTCPListen reverse_tcp_listen = 7;
    ReverseTCPAccept reverse_tcp_accept = 8;
  }
}

// AccessCapability identifies the single operation authorized by a ticket.
enum AccessCapability {
  ACCESS_CAPABILITY_UNSPECIFIED = 0;
  ACCESS_CAPABILITY_SHELL = 1;
  ACCESS_CAPABILITY_COMMAND = 2;
  ACCESS_CAPABILITY_SFTP = 3;
  ACCESS_CAPABILITY_ENDPOINT = 4;
  ACCESS_CAPABILITY_LOOPBACK_TCP = 5;
  ACCESS_CAPABILITY_REVERSE_TCP_LISTEN = 6;
  ACCESS_CAPABILITY_REVERSE_TCP_ACCEPT = 7;
}

// AccessTicketClaims is signed by Manager and verified by the current Agent.
message AccessTicketClaims {
  uint32 protocol_version = 1;
  string site_uid = 2;
  string resource_uid = 3;
  string runtime_uuid = 4;
  string pod_uid = 5;
  int64 target_version = 6;
  AccessCapability capability = 7;
  string endpoint_id = 8;
  int64 expires_unix = 9;
  bytes nonce = 10;
}

message Terminal {
  string term = 1;
  TerminalSize size = 2;
}

message TerminalSize {
  uint32 columns = 1;
  uint32 rows = 2;
}

message Shell {
  // terminal is present when the SSH shell request allocated a PTY.
  Terminal terminal = 1;
}

message Command {
  // SSH exec commands are evaluated by the selected user's login shell.
  string command = 1;
  // terminal is present when the SSH exec request allocated a PTY.
  Terminal terminal = 2;
}

message SFTP {}

message Endpoint {
  string endpoint_id = 1;
}

message LoopbackTCP {
  uint32 port = 1;
}

message ReverseTCPListen {
  string listener_id = 1;
  oneof target {
    ContainerTCPBind container = 2;
    string usbip_source = 3;
  }
}

message ContainerTCPBind {
  string address = 1;
  uint32 port = 2;
}

message ReverseTCPReady {
  uint32 port = 1;
}

message ReverseTCPAccept {
  string listener_id = 1;
  string connection_id = 2;
}

message ReverseTCPConnection {
  string connection_id = 1;
  string origin_host = 2;
  uint32 origin_port = 3;
}

message AccessResponse {
  oneof frame {
    // Process attached, or TCP target connected. Sent before stdout.
    bool accepted = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    int32 exit_status = 4;
    // TCP target finished sending. The input direction remains writable.
    bool stdout_eof = 5;
    ReverseTCPConnection reverse_tcp_connection = 6;
    ReverseTCPReady reverse_tcp_ready = 7;
  }
}
