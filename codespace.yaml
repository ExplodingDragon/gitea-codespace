node:
  name: "local-incus-manager"
  state_dir: "codespace-state"
  capacity_total: 4

gateway:
  http:
    listen: ":18081"
    public_url: "http://codespace.fbi.com:18081"
  ssh:
    listen: ":2222"
    public_addr: "codespace.fbi.com:2222"

runtime:
  web_ide:
    code_server_version: "4.121.0"
  incus:
    endpoint: "unix:///var/lib/incus/unix.socket"
    project:
      name: "gitea-codespace"
      manage: true
    storage:
      pool: "default"
    network:
      name: "csnet"
      manage: true
  environments:
    - tag: "default"
      type: "lxc"
      source:
        image: "images:debian/12"
      resources:
        cpu: 1
        memory: "1GiB"
        root_disk: "10GiB"
