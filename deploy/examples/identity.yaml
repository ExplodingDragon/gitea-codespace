# Development-only identity issuer. Production clusters should use their
# existing cert-manager trust hierarchy and set identity.clusterIssuer in Helm.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: codespace-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: codespace-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: Codespace internal CA
  secretName: codespace-root
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages: [cert sign, crl sign]
  issuerRef:
    name: codespace-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: codespace-identity
spec:
  ca:
    secretName: codespace-root
